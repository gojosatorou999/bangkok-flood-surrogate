# City registry for the dashboard's city selector.
# `bbox` is [west, south, east, north] in WGS84 lon/lat.
# `has_flood_model: false` means no ANUGA/surrogate grid exists yet for that
# city -- the dashboard shows CCTV cameras only and hides depth/flood layers,
# rather than erroring against a grid that doesn't exist.
cities:
  - id: bangkok
    name_en: Bangkok
    name_th: "กรุงเทพมหานคร"
    bbox: [100.30, 13.50, 100.95, 13.95]   # approximate; the model's own grid (flood_surrogate.py) is authoritative for the flood layers
    has_flood_model: true
    epsg_model: 32647

  - id: hatyai
    name_en: Hat Yai
    name_th: "หาดใหญ่"
    bbox: [100.15, 6.62, 100.70, 7.18]   # from hatyai_bbox_shp/hatyai_bbox.shp (area_km2_a=3763, epsg_model=32647)
    has_flood_model: false   # ANUGA/surrogate model not yet built for this city -- CCTV only until then
    epsg_model: 32647
